[tox]
envlist =
    check
    docs
    typecheck
    {core,full}{,-coverage}
    nightly
isolated_build = True
isolated_build_env = build

[gh-actions]
python =
    3.11: core
    3.12: core, check
    3.13: core
    3.14: core

[testenv]
description = Run the test suite
setenv =
    PYTHONUNBUFFERED = yes
    PYTEST_EXTRA_ARGS = -s
    coverage: PYTEST_EXTRA_ARGS = --cov --cov-report xml --cov-report term
passenv = *
extras =
    test
allowlist_externals = pytest
commands =
    pytest {env:PYTEST_EXTRA_ARGS:} {posargs:-vv}

[testenv:core]
description = Run core/fast test suite (excludes slow tests)
extras = test
commands =
    pytest -m "not slow" {env:PYTEST_EXTRA_ARGS:} {posargs:-vv}

[testenv:core-coverage]
description = Run core test suite with coverage
extras = test
commands =
    pytest -m "not slow" --cov --cov-report xml --cov-report term {posargs:-vv}

[testenv:full]
description = Run full test suite (all tests including slow ones)
extras = test
commands =
    pytest {env:PYTEST_EXTRA_ARGS:} {posargs:-vv}

[testenv:full-coverage]
description = Run full test suite with coverage
extras = test
commands =
    pytest --cov --cov-report xml --cov-report term {posargs:-vv}

[testenv:nightly]
description = Run core tests against nightly scientific-python packages
install_command = python -I -m pip install --extra-index-url https://pypi.anaconda.org/scientific-python-nightly-wheels/simple {opts} {packages}
pip_pre = true
extras = test
commands =
    pytest -m "not slow" {env:PYTEST_EXTRA_ARGS:} {posargs:-vv}

[testenv:check]
description = Perform style checks and build the package
deps =
    build
    prek
skip_install = true
commands =
    prek run --all-files --show-diff-on-failure
    python -m build

[testenv:typecheck]
description = Run static type checks (mypy gate + ty complementary)
extras =
    dev
commands =
    mypy kerneljax
    ty check kerneljax

[testenv:docs]
description = Build HTML docs
extras = doc
allowlist_externals = rm
commands =
    rm -rf "{toxworkdir}/docs_out" "{toxworkdir}/docs_doctree"
    sphinx-build -d "{toxworkdir}/docs_doctree" docs/source "{toxworkdir}/docs_out" --color -v -bhtml

[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
